[workspace]
members = ["apps/cas", "vendor/sqlx-cloudflare-hd"]
resolver = "2"

# sqlx 0.9.0 cannot open a connection on wasm32-unknown-unknown (Cloudflare
# Workers): `PgStream::connect` only knows TCP and unix sockets, and
# `std::time::Instant::now()` traps there. The MemeBattle fork adds
# `PgConnection::connect_with_socket` and a wasm-safe `Instant`, which upstream
# refused in transact-rs/sqlx#4444. The pinned commit is tag v0.9.0 plus those
# two cherry-picks (tag v0.9.0-memebattle.1, branch memebattle/v0.9.0-wasm-socket).
[patch.crates-io]
sqlx = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }
sqlx-core = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }
sqlx-postgres = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }

# webauthn-rs 0.6.1-dev (the first release without OpenSSL, which does not
# build for wasm32) still reads `std::time::SystemTime::now()` when a
# registration finishes and in `Credential::verify_attestation`, which panics
# on wasm32-unknown-unknown (Cloudflare Workers). The MemeBattle fork reads the
# clock through `web-time` instead, and adds `WebauthnBuilder::algorithms` so
# CAS can keep offering exactly ES256 and RS256 (0.6's default adds ES384). The
# pinned commit is upstream 8a80623a (the commit crates.io's 0.6.1-dev was
# published from) plus those two changes (tag v0.6.1-dev-memebattle.2, branch
# memebattle/v0.6.1-dev-wasm-clock). All the
# workspace's webauthn crates come from the same rev: they pin each other
# exactly. See apps/cas/docs/adr/0020-webauthn-rs-0-6.md.
webauthn-rs = { git = "https://github.com/MemeBattle/webauthn-rs", rev = "62a8bd71a6671daacee821f3da6d31e467a55329" }
webauthn-rs-core = { git = "https://github.com/MemeBattle/webauthn-rs", rev = "62a8bd71a6671daacee821f3da6d31e467a55329" }
webauthn-rs-proto = { git = "https://github.com/MemeBattle/webauthn-rs", rev = "62a8bd71a6671daacee821f3da6d31e467a55329" }
webauthn-attestation-ca = { git = "https://github.com/MemeBattle/webauthn-rs", rev = "62a8bd71a6671daacee821f3da6d31e467a55329" }
webauthn-authenticator-rs = { git = "https://github.com/MemeBattle/webauthn-rs", rev = "62a8bd71a6671daacee821f3da6d31e467a55329" }
