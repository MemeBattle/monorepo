[workspace]
members = ["apps/cas"]
resolver = "2"

# sqlx 0.9.0 cannot open a connection on wasm32-unknown-unknown (Cloudflare
# Workers): `PgStream::connect` only knows TCP and unix sockets, and
# `std::time::Instant::now()` traps there. The MemeBattle fork adds
# `PgConnection::connect_with_socket` and a wasm-safe `Instant`, which upstream
# refused in transact-rs/sqlx#4444. The pinned commit is tag v0.9.0 plus those
# two cherry-picks (tag v0.9.0-memebattle.1, branch memebattle/v0.9.0-wasm-socket).
[patch.crates-io]
sqlx = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }
sqlx-core = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }
sqlx-postgres = { git = "https://github.com/MemeBattle/sqlx", rev = "09ef6ac9470a13bad45c54df8f51d026d21e8625" }
