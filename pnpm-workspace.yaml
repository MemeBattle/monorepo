packages:
  - packages/*
  - apps/*

engineStrict: true

linkWorkspacePackages: true
preferWorkspacePackages: true
disallowWorkspaceCycles: true
injectWorkspacePackages: true

# Fix for pnpm type resolution: hoist React types to prevent conflicts
publicHoistPattern:
  - '@types/react'
  - '@types/react-dom'

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  '@types/node': 'catalog:'

# Dependencies allowed to run install scripts. With strictDepBuilds on by default,
# anything missing here fails the install with ERR_PNPM_IGNORED_BUILDS instead of
# being skipped with a warning, so every package with a build script is listed.
# The `false` entries were already being ignored under pnpm 10 — they ship prebuilt
# binaries or optional native addons and the repo has never needed their scripts.
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  contentlayer: true
  esbuild: true
  protobufjs: true
  '@parcel/watcher': false
  '@sentry/cli': false
  core-js: false
  fsevents: false
  sharp: false

