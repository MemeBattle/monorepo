name: 'Ligretto pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ligretto-**'
      - 'packages/ligretto-auth/**'
      - 'packages/ligretto-core-client/**'
      - 'packages/ligretto-shared/**'
      - 'packages/ui/**'
      - 'packages/analytics/**'
      - .github/workflows/ligretto-pr.yml
      - '.env*'
      - 'pnpm-lock.yaml'
      - package.json
      - pnpm-workspace.yaml

concurrency:
  group: ligretto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Against the production CAS: client `ligretto-ci` is registered for the :3333 callback and the :5174 post-logout.
  # Each run leaves guest accounts there, and the check fails while that CAS is down.
  e2e:
    env:
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5433/ligretto-core
      # Overrides the local CAS of the root .env.development.
      CAS_ISSUER: https://cas.mems.fun
      # Differs from the .env files on purpose: proves the shell wins over them for both backends.
      LIGRETTO_INTERNAL_API_TOKEN: e2e-internal-api-token
      LIGRETTO_APP_URL: http://localhost:5174
      CAS_URL: https://cas.mems.fun
      LOG_LEVEL: debug

    services:
      postgres:
        image: postgres:13.4
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Install Playwright Browsers
        run: pnpm --filter=@memebattle/ligretto-frontend exec playwright install --with-deps chromium

      - name: Migrate database
        run: pnpm ligretto:core-backend:migrate

      - name: Start core backend
        env:
          LIGRETTO_CAS_CLIENT_ID: ligretto-ci
          LIGRETTO_CAS_CLIENT_SECRET: ${{ secrets.LIGRETTO_CI_CAS_CLIENT_SECRET }}
        run: pnpm ligretto:core-backend:start:dev > /tmp/core-backend.log 2>&1 &

      - name: Check core backend app
        run: pnpm dlx wait-on --timeout 60000 http-get://127.0.0.1:3333/health

      - name: Start gameplay backend
        run: pnpm ligretto:gameplay-backend:start:dev > /tmp/gameplay-backend.log 2>&1 &

      # No `--` before the flags: with one, Vite drops them and binds 5173.
      - name: Start frontend
        run: pnpm --filter @memebattle/ligretto-frontend start:dev --port 5174 --strictPort > /tmp/frontend.log 2>&1 &

      - name: Check frontend app
        run: pnpm dlx wait-on -c ./apps/ligretto-frontend/waitOnConfig.json --timeout 60000 http-get://127.0.0.1:5174

      - name: Run playwright tests
        run: pnpm --filter=@memebattle/ligretto-frontend e2e:start

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            apps/ligretto-frontend/playwright-report/
            apps/ligretto-frontend/test-results/
            /tmp/core-backend.log
            /tmp/gameplay-backend.log
            /tmp/frontend.log
          retention-days: 7
