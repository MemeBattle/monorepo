name: 'Ligretto pull request'

# The product as a whole. A package's own checks run in its own workflow: ligretto-frontend-pr.yml,
# ligretto-core-backend-pr.yml, ligretto-gameplay-backend-pr.yml, ligretto-auth-pr.yml and ligretto-core-client-pr.yml.

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ligretto-**'
      - 'packages/ligretto-auth/**'
      - 'packages/ligretto-core-client/**'
      - 'packages/ligretto-shared/**'
      - 'packages/ui/**'
      - 'packages/analytics/**'
      - .github/workflows/ligretto-pr.yml
      - '.env*'
      - 'pnpm-lock.yaml'
      - package.json
      - pnpm-workspace.yaml

# A new push makes the run for the previous one obsolete.
concurrency:
  group: ligretto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The guest sign-in end to end: the core's Postgres, the core backend on :3333, the gameplay backend, the frontend
  # on :5174 and Playwright, against the production CAS (https://cas.mems.fun). Nothing of CAS is built here. The
  # browser follows the redirects to CAS and back through the confidential client `ligretto-ci`, registered with the
  # redirect http://localhost:3333/api/auth/callback, the post-logout http://localhost:5174/ and the audience
  # `ligretto`, so the core and the gameplay backend accept its tokens; the guest grant needs no passkey. The gameplay
  # backend verifies CAS tokens, so no stub can stand in for CAS.
  # Two costs: every run leaves a few guest accounts in the production CAS until CAS has a guest GC (an open question
  # of apps/cas/docs/PLAN.md), and the check fails while the production CAS is down, as the nightly Ligretto
  # schedule-E2E already does.
  e2e:
    env:
      # The core backend reads it for its migrations and its start, from the job's Postgres below.
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5433/ligretto-core
      # The root .env.development points at the local CAS; the core and the gameplay backend both read this one.
      CAS_ISSUER: https://cas.mems.fun
      # A CI-only value, read by the core backend and by the gameplay backend over the public-by-construction one of
      # the .env files, which proves the shell wins over the files for both.
      LIGRETTO_INTERNAL_API_TOKEN: e2e-internal-api-token
      # Where Playwright opens the app; .env sets the production site for the other suites.
      LIGRETTO_APP_URL: http://localhost:5174
      # Read by ligretto-frontend's build for the profile link; the backend does not read it.
      CAS_URL: https://cas.mems.fun
      LOG_LEVEL: debug

    services:
      postgres:
        image: postgres:13.4
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Install Playwright Browsers
        run: pnpm --filter=@memebattle/ligretto-frontend exec playwright install --with-deps chromium

      - name: Migrate database
        run: pnpm ligretto:core-backend:migrate

      # The CAS client of this job, on this step alone.
      - name: Start core backend
        env:
          LIGRETTO_CAS_CLIENT_ID: ligretto-ci
          LIGRETTO_CAS_CLIENT_SECRET: ${{ secrets.LIGRETTO_CI_CAS_CLIENT_SECRET }}
        run: pnpm ligretto:core-backend:start:dev > /tmp/core-backend.log 2>&1 &

      - name: Check core backend app
        run: pnpm dlx wait-on --timeout 60000 http-get://127.0.0.1:3333/health

      - name: Start gameplay backend
        run: pnpm ligretto:gameplay-backend:start:dev > /tmp/gameplay-backend.log 2>&1 &

      # No `--` before the flags: with one, Vite drops them and binds 5173.
      - name: Start frontend
        run: pnpm --filter @memebattle/ligretto-frontend start:dev --port 5174 --strictPort > /tmp/frontend.log 2>&1 &

      - name: Check frontend app
        run: pnpm dlx wait-on -c ./apps/ligretto-frontend/waitOnConfig.json --timeout 60000 http-get://127.0.0.1:5174

      - name: Run playwright tests
        run: pnpm --filter=@memebattle/ligretto-frontend e2e:start

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            apps/ligretto-frontend/playwright-report/
            apps/ligretto-frontend/test-results/
            /tmp/core-backend.log
            /tmp/gameplay-backend.log
            /tmp/frontend.log
          retention-days: 7
