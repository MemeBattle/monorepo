name: 'Ligretto core pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ligretto-core/**'
      - .github/workflows/ligretto-core-pr.yml
      - 'pnpm-lock.yaml'
      - package.json
      - pnpm-workspace.yaml
      # The Node smoke test boots the entry on the repository root .env* files.
      - '.env*'

# A new push makes the run for the previous one obsolete.
concurrency:
  group: ligretto-core-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # The directory boundaries of docs/adrs/layering-and-runtime-neutrality.md live in apps/ligretto-core/oxlint.config.ts.
      - name: Lint
        run: pnpm run --filter @memebattle/ligretto-core lint

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # Two programs: Node with the shared layers, and the Worker with the same layers against the Workers types.
      - name: TS check
        run: pnpm run --filter @memebattle/ligretto-core ts-check

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Run the unit and HTTP suites
        run: pnpm run --filter @memebattle/ligretto-core test:unit

  node-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # No NODE_ENV, so the entry loads the root .env.development as on a developer's machine. Detached with `&`: the
      # process is killed in the job's cleanup, and its log is uploaded below when the job fails.
      - name: Start the Node entry
        run: pnpm --filter @memebattle/ligretto-core exec tsx src/entry/node.ts > /tmp/ligretto-core.log 2>&1 &

      - name: Wait for the Node entry
        run: pnpm exec wait-on --timeout 60000 http-get://127.0.0.1:3333/health

      - name: GET /health answers ok
        run: curl -fsS http://127.0.0.1:3333/health | jq -e '.status == "ok"'

      - name: An unknown route is a 404
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/nope)" = 404

      - name: Upload the Node entry log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ligretto-core-node-log
          path: /tmp/ligretto-core.log
          retention-days: 2

  worker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # The production bundle builds from cloudflare.config.ts.
      - name: Build the Worker
        run: pnpm run --filter @memebattle/ligretto-core build:worker

      # The same entry under workerd, through @cloudflare/vitest-plugin: /health on both hostnames and through the
      # InternalApi service binding.
      - name: Run the Worker smoke suite
        run: pnpm run --filter @memebattle/ligretto-core test:worker
