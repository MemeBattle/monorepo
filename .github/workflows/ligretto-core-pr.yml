name: 'Ligretto core pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ligretto-core/**'
      # The public document and the auth routes are built from this package's schemas and route fragments.
      - 'packages/ligretto-auth/**'
      - .github/workflows/ligretto-core-pr.yml
      - 'pnpm-lock.yaml'
      - package.json
      - pnpm-workspace.yaml
      # The Node smoke test boots the entry on the repository root .env* files.
      - '.env*'

# A new push makes the run for the previous one obsolete.
concurrency:
  group: ligretto-core-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # The directory boundaries of docs/adrs/layering-and-runtime-neutrality.md live in apps/ligretto-core/oxlint.config.ts.
      - name: Lint
        run: pnpm run --filter @memebattle/ligretto-core lint

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # Two programs: Node with the shared layers, and the Worker with the same layers against the Workers types.
      - name: TS check
        run: pnpm run --filter @memebattle/ligretto-core ts-check

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Run the unit and HTTP suites
        run: pnpm run --filter @memebattle/ligretto-core test:unit

  store-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The engine of the compose test service: the oldest in play.
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core-test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core-test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # What needs a real Postgres: row locks, two connections, the migrate and codegen entries. The suite wipes the
      # database it is given and refuses one whose name does not end in -test.
      - name: Run the store suite
        env:
          LIGRETTO_CORE_TEST_DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5435/ligretto-core-test
        run: pnpm run --filter @memebattle/ligretto-core test:store:run

  schema-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The engine of the compose test service: the oldest in play.
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # Exported for both steps: the shared loader lets the shell win over the package's .env.development.
    env:
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5433/ligretto-core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Migrate an empty database
        run: pnpm run --filter @memebattle/ligretto-core migrate

      - name: Migrate again, which applies nothing
        run: pnpm run --filter @memebattle/ligretto-core migrate

      - name: Regenerate the row types
        run: pnpm run --filter @memebattle/ligretto-core db:codegen

      # Written and diffed rather than `db:codegen --verify`, so the log shows the difference.
      - name: The committed row types match the migrated schema
        run: |
          git diff --exit-code -- apps/ligretto-core/src/adapters/pg/schema.generated.ts || {
            echo "::error::schema.generated.ts is out of date: run 'pnpm db:codegen' in apps/ligretto-core after migrating and commit the result"
            exit 1
          }

  openapi:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # Both documents from the app factories; no database, no request served.
      - name: Regenerate the OpenAPI documents
        run: pnpm run --filter @memebattle/ligretto-core openapi:generate

      # Written and diffed rather than `openapi:generate --verify`, so the log shows the difference.
      - name: The committed documents match the routes
        run: |
          git diff --exit-code -- apps/ligretto-core/openapi.json apps/ligretto-core/openapi.internal.json || {
            echo "::error::the OpenAPI documents are out of date: run 'pnpm openapi:generate' in apps/ligretto-core and commit the result"
            exit 1
          }

  node-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The package's .env.development points DATABASE_URL here; /health runs a constant select, so no migration.
    services:
      postgres:
        # The engine of the compose test service: the oldest in play.
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # No NODE_ENV, so the entry loads the package and root .env.development as on a developer's machine. Detached
      # with `&`: the process is killed in the job's cleanup, and its log is uploaded below when the job fails.
      # `--conditions=development` resolves @memebattle/ligretto-auth from source, as `pnpm start:dev` does.
      - name: Start the Node entry
        run: pnpm --filter @memebattle/ligretto-core exec tsx --conditions=development src/entry/node.ts > /tmp/ligretto-core.log 2>&1 &

      - name: Wait for the Node entry
        run: pnpm exec wait-on --timeout 60000 http-get://127.0.0.1:3333/health

      - name: GET /health answers ok
        run: curl -fsS http://127.0.0.1:3333/health | jq -e '.status == "ok"'

      - name: An unknown route is a 404
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/nope)" = 404

      # The guard answers before any query, so the unmigrated database is enough.
      - name: An internal route without the token is a 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/internal/games)" = 401

      # The token of the root .env.development, public by construction. The request validator runs after the guard
      # and before any query, so a 400 for an empty body proves the token was accepted without a migrated database.
      - name: An internal route with the configured token passes the guard
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'authorization: Bearer dev-only-internal-api-token-public-by-construction' \
            -H 'content-type: application/json' -d '{}' \
            http://127.0.0.1:3333/internal/games/00000000-0000-4000-8000-000000000000/rounds)" = 400

      # The access-token guard answers before any query and before CAS is asked for anything.
      - name: GET /api/users without an access token is a 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3333/api/users?ids=someone')" = 401

      # A logout with no session ends nothing, so it needs neither the database nor CAS: the auth handlers are mounted.
      - name: GET /api/auth/logout without a session redirects to the application
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/api/auth/logout)" = 302

      - name: GET /openapi.json serves the public document
        run: curl -fsS http://127.0.0.1:3333/openapi.json | jq -e '.paths["/api/users"].get'

      - name: Upload the Node entry log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ligretto-core-node-log
          path: /tmp/ligretto-core.log
          retention-days: 2

  worker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The Hyperdrive bindings' dev.connectionString in cloudflare.config.ts points here.
    services:
      postgres:
        # The engine of the compose test service: the oldest in play.
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # The production bundle builds from cloudflare.config.ts.
      - name: Build the Worker
        run: pnpm run --filter @memebattle/ligretto-core build:worker

      # The same entry under workerd, through @cloudflare/vitest-plugin: /health on both hostnames and through the
      # InternalApi service binding, each with its database check over the emulated Hyperdrive bindings, and the
      # internal token from .dev.vars: refused when missing or wrong, accepted when it is the configured one.
      - name: Run the Worker smoke suite
        run: pnpm run --filter @memebattle/ligretto-core test:worker
