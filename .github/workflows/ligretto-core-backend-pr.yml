name: 'Ligretto core backend pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ligretto-core-backend/**'
      - 'packages/ligretto-auth/**'
      - .github/workflows/ligretto-core-backend-pr.yml
      - 'pnpm-lock.yaml'
      - package.json
      - pnpm-workspace.yaml
      - '.env*'

concurrency:
  group: ligretto-core-backend-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Lint
        run: pnpm run --filter @memebattle/ligretto-core-backend lint

  ts-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: TS check
        run: pnpm run --filter @memebattle/ligretto-core-backend ts-check

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Run the unit and HTTP suites
        run: pnpm run --filter @memebattle/ligretto-core-backend test:unit

  store-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The compose test service's engine, the oldest in play.
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core-test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core-test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Run the store suite
        env:
          LIGRETTO_CORE_TEST_DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5435/ligretto-core-test
        run: pnpm run --filter @memebattle/ligretto-core-backend test:store:run

  migration-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the migrations against the base branch
        run: apps/ligretto-core-backend/scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  # schema-current, schema-previous and code-previous: docs/adrs/additive-migrations-and-compatibility-matrix.md.
  schema-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # Job-level, because the shell wins over the package's .env.development.
    env:
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5433/ligretto-core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: PR migrations, PR code
        run: apps/ligretto-core-backend/scripts/check-schema-compat.sh --migrations . --code .

      - name: Migrate again, which applies nothing
        run: pnpm run --filter @memebattle/ligretto-core-backend migrate

      # Written and diffed rather than `db:codegen --verify`, so the log shows the difference.
      - name: The committed row types match the migrated schema
        run: |
          git diff --exit-code -- apps/ligretto-core-backend/src/adapters/pg/schema.generated.ts || {
            echo "::error::schema.generated.ts is out of date: run 'pnpm db:codegen' in apps/ligretto-core-backend after migrating and commit the result"
            exit 1
          }

  schema-previous:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5433/ligretto-core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: previous

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      # On failure, the code uses a shape the new migration introduces: ship the migration alone first.
      - name: Master's migrations, PR code
        run: apps/ligretto-core-backend/scripts/check-schema-compat.sh --migrations previous --code .

  code-previous:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core-test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core-test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # One database for both: the store suite wipes and re-migrates it after the type check.
    env:
      DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5435/ligretto-core-test
      LIGRETTO_CORE_TEST_DATABASE_URL: postgres://ligretto-core-user:ligretto_pg_password@localhost:5435/ligretto-core-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: previous

      # Only master's tree runs here, so only it is installed.
      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js
        with:
          working-directory: previous

      # On failure, the migration breaks a shape master still uses: ship the code that stops using it first.
      - name: PR migrations, master's code and store suite
        run: apps/ligretto-core-backend/scripts/check-schema-compat.sh --migrations . --code previous --store

  openapi:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Regenerate the OpenAPI documents
        run: pnpm run --filter @memebattle/ligretto-core-backend openapi:generate

      # Written and diffed rather than `openapi:generate --verify`, so the log shows the difference.
      - name: The committed documents match the routes
        run: |
          git diff --exit-code -- apps/ligretto-core-backend/openapi.json apps/ligretto-core-backend/openapi.internal.json || {
            echo "::error::the OpenAPI documents are out of date: run 'pnpm openapi:generate' in apps/ligretto-core-backend and commit the result"
            exit 1
          }

  node-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # DATABASE_URL comes from the package's .env.development; /health needs no migration.
    services:
      postgres:
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Run the Node smoke suite
        env:
          LIGRETTO_CORE_NODE_LOG: ${{ runner.temp }}/ligretto-core-node.log
        run: pnpm run --filter @memebattle/ligretto-core-backend test:node

      - name: Upload the Node entry log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ligretto-core-backend-node-log
          path: ${{ runner.temp }}/ligretto-core-node.log
          retention-days: 2

  worker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The Hyperdrive bindings' dev.connectionString in cloudflare.config.ts points here.
    services:
      postgres:
        image: postgres:13.4
        env:
          POSTGRES_USER: ligretto-core-user
          POSTGRES_PASSWORD: ligretto_pg_password
          POSTGRES_DB: ligretto-core
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ligretto-core-user -d ligretto-core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/prepare-nodejs
        name: Prepare Node.js

      - name: Build the Worker
        run: pnpm run --filter @memebattle/ligretto-core-backend build:worker

      # The cron handler needs the tables.
      - name: Migrate the database
        run: pnpm run --filter @memebattle/ligretto-core-backend migrate

      - name: Run the Worker smoke suite
        run: pnpm run --filter @memebattle/ligretto-core-backend test:worker
