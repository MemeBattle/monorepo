name: 'CAS pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/cas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cas-**'

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        working-directory: apps/cas
        run: cargo fmt --check

  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: apps/cas
        run: cargo test

  migration-order:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check compares against origin/master, so it needs full history.
          fetch-depth: 0

      - name: Check migration timestamp order
        run: apps/cas/scripts/check-migration-order.sh

  clippy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        working-directory: apps/cas
        run: cargo clippy --all-targets --all-features
