name: 'CAS pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/cas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cas-**'

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        working-directory: apps/cas
        run: cargo fmt --check

  test:
    runs-on: ubuntu-24.04

    # Repository tests use `#[sqlx::test]`, which creates a throwaway database
    # per test from DATABASE_URL and applies the migrations into it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
        run: cargo test

  sqlx-cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: '1.21.1'

      - name: Install sqlx-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo binstall sqlx-cli@0.9.0
          --no-confirm
          --disable-strategies compile
          --disable-telemetry

      - name: Apply migrations
        working-directory: apps/cas
        env:
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
          SQLX_OFFLINE: 'true'
        run: cargo run --bin cas-migrate

      - name: Check SQLx query cache
        working-directory: apps/cas
        env:
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
        run: cargo sqlx prepare --check

  migration-order:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check compares against origin/master, so it needs full history.
          fetch-depth: 0

      - name: Check migration timestamp order
        run: apps/cas/scripts/check-migration-order.sh

  clippy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
        run: cargo clippy --all-targets --all-features
