name: 'CAS pull request'

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/cas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # The wasm32 rustflags the Worker build needs live here, so a change to
      # them must not skip the jobs that depend on them (ADR 0022 (h)).
      - '.cargo/**'
      - 'vendor/**'
      - '.github/workflows/cas-**'
      - '.docker/Cas_**'
      # The frontend stages of the image build from these, so a change to them
      # must not skip the job that proves it.
      - 'apps/cas-frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        working-directory: apps/cas
        run: cargo fmt --check

  test:
    runs-on: ubuntu-24.04

    # Repository tests use `#[sqlx::test]`, which creates a throwaway database
    # per test from DATABASE_URL and applies the migrations into it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
        run: cargo test

  sqlx-cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cas
          POSTGRES_PASSWORD: cas
          POSTGRES_DB: cas
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: '1.21.1'

      - name: Install sqlx-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo binstall sqlx-cli@0.9.0
          --no-confirm
          --disable-strategies compile
          --disable-telemetry

      - name: Apply migrations
        working-directory: apps/cas
        env:
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
          SQLX_OFFLINE: 'true'
        run: cargo run --bin cas-migrate

      - name: Check SQLx query cache
        working-directory: apps/cas
        env:
          DATABASE_URL: postgres://cas:cas@localhost:5434/cas
        run: cargo sqlx prepare --check

  migration-order:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check compares against origin/master, so it needs full history.
          fetch-depth: 0

      - name: Check migration timestamp order
        run: apps/cas/scripts/check-migration-order.sh

  clippy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
        run: cargo clippy --all-targets --all-features

  # The vendored Hyperdrive adapter is not a dependency of CAS and only has
  # code behind its `postgres` feature, so no other job compiles it. This one
  # builds it for the target it exists for, which also compiles the wasm-only
  # paths of the sqlx fork pinned in the root Cargo.toml.
  vendor-wasm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cargo check (wasm32)
        run: cargo check --locked -p sqlx-cloudflare-hd --features postgres --target wasm32-unknown-unknown

      - name: Cargo clippy (wasm32)
        run: cargo clippy --locked -p sqlx-cloudflare-hd --features postgres --target wasm32-unknown-unknown -- -D warnings

  # The Cloudflare Workers build of the library (ADR 0022). `--lib` on
  # purpose: the three binaries are native-only and stay that way. No Postgres
  # service — the macros read the offline cache.
  lib-wasm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cargo check (wasm32)
        env:
          SQLX_OFFLINE: 'true'
        run: cargo check --locked -p cas --lib --target wasm32-unknown-unknown

      - name: Cargo clippy (wasm32)
        env:
          SQLX_OFFLINE: 'true'
        run: cargo clippy --locked -p cas --lib --target wasm32-unknown-unknown -- -D warnings

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          push: false
          context: '.'
          file: '.docker/Cas_Dockerfile'
          build-args: CAS_BUILD_PROFILE=${{ matrix.profile }}
