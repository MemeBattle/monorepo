name: 'Ligretto release'

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/ligretto-core-backend/**'
      - 'apps/ligretto-frontend/**'
      - 'packages/ligretto-auth/**'
      - 'packages/ligretto-core-client/**'
      - 'packages/ligretto-shared/**'
      - 'packages/ui/**'
      - 'packages/analytics/**'
      - '.env*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ligretto-release.yml'

env:
  CLOUDFLARE_ACCOUNT_ID: 2155fed9f68a1bc94fab7d9e5bb6eaac
  LIGRETTO_APP_VERSION: ${{ github.run_id }}

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Node.js
        uses: ./.github/actions/prepare-nodejs

      - name: Build the Worker
        run: pnpm run --filter @memebattle/ligretto-core-backend build:worker

      - name: Upload the Worker
        uses: actions/upload-artifact@v7
        with:
          name: ligretto-core-backend-worker
          path: apps/ligretto-core-backend/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Node.js
        uses: ./.github/actions/prepare-nodejs

      - name: Build the Worker
        run: pnpm run --filter @memebattle/ligretto-frontend build:worker

      - name: Upload the Worker
        uses: actions/upload-artifact@v7
        with:
          name: ligretto-frontend-worker
          path: apps/ligretto-frontend/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-frontend, build-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    environment:
      name: Ligretto-production
      url: https://ligretto.app

    concurrency:
      group: ligretto-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Node.js
        uses: ./.github/actions/prepare-nodejs

      - name: Download the core Worker
        uses: actions/download-artifact@v8
        with:
          name: ligretto-core-backend-worker
          path: apps/ligretto-core-backend/.cloudflare/output

      - name: Download the frontend Worker
        uses: actions/download-artifact@v8
        with:
          name: ligretto-frontend-worker
          path: apps/ligretto-frontend/.cloudflare/output

      - name: Check the core release
        working-directory: apps/ligretto-core-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec scripts/check-release.sh

      # The Editor token cannot create a Worker (the first activation does it by hand); checked before the migrations.
      - name: Check the frontend Worker exists
        working-directory: apps/ligretto-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! pnpm exec cf workers get ligretto-frontend > /dev/null; then
            echo "::error::could not read the ligretto-frontend Worker (see the cf output above). If this is the first release, it may not exist yet: create it (apps/ligretto-core-backend/README.md, First activation, before the first release only)"
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm run --filter @memebattle/ligretto-core-backend migrate

      - name: Deploy the core
        working-directory: apps/ligretto-core-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="${COMMIT_MESSAGE%%$'\n'*}"
          pnpm exec cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "${message:-manual release}"

      # Last, so a new SPA never meets an old API.
      - name: Deploy the frontend
        working-directory: apps/ligretto-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="${COMMIT_MESSAGE%%$'\n'*}"
          pnpm exec cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "${message:-manual release}"

      # Source maps never decide a release.
      - name: Upload the source maps to Sentry
        continue-on-error: true
        working-directory: apps/ligretto-frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: memebattle-1x
          SENTRY_PROJECT: ligretto-frontend
        run: |
          pnpm exec sentry-cli releases new "$LIGRETTO_APP_VERSION"
          # `~/assets` is Sentry's URL prefix for any host, not a path.
          # shellcheck disable=SC2088
          pnpm exec sentry-cli sourcemaps upload --release "$LIGRETTO_APP_VERSION" --url-prefix '~/assets' .cloudflare/output/v0/workers/default/assets/assets
          pnpm exec sentry-cli releases finalize "$LIGRETTO_APP_VERSION"
