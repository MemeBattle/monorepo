name: 'CAS release'

# CAS and its frontend are one Cloudflare Worker on cas.mems.fun: the Rust
# entrypoint (ADR 0022) for CAS's own paths, the SPA as its static assets
# (apps/cas/cloudflare.config.ts). A release builds everything, then runs the
# migrations outside the Worker over a direct connection to the origin
# database, then uploads.

on:
  workflow_dispatch:
  push:
    # TEMPORARY: the test release from the PR branch. Revert before merging.
    branches: [master, feat/cas-frontend-and-cd]
    paths:
      - 'apps/cas/**'
      - 'apps/cas-frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'vendor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cas-deploy.yml'

# Never two releases at once, and never cancel one halfway through its
# migrations.
concurrency:
  group: cas-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 2155fed9f68a1bc94fab7d9e5bb6eaac

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: CAS-production
      url: https://cas.mems.fun

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: '1.21.1'

      # Everything is built before anything touches the database, and the
      # migrations run before the upload: a build that fails never leaves the
      # schema ahead of the deployed code. Node, the worker-build install and
      # the cas-migrate build do not depend on each other and run in the
      # background; each later step waits only for what it uses.
      - name: Prepare Node.js
        id: node
        uses: ./.github/actions/prepare-nodejs
        background: true

      # The same version as the `worker` crate in apps/cas/Cargo.toml.
      - name: Install worker-build
        id: worker-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall worker-build@0.8.7 --no-confirm --disable-telemetry
        background: true

      # A target directory of its own, so this native build and the Worker's
      # wasm build below do not wait on each other's lock.
      - name: Build cas-migrate
        id: migrate-build
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/migrate
        run: cargo build --locked --bin cas-migrate
        background: true

      - name: Wait for Node
        wait: node

      # Before the Worker's build, not inside its build command: Wrangler
      # checks that the assets directory exists before it runs that command.
      - name: Build the frontend
        run: pnpm cas:front:build

      - name: Wait for worker-build
        wait: worker-build

      # The Worker (apps/cas/wrangler.config.ts) with the SPA as its assets,
      # into .cloudflare/output for the upload below.
      - name: Build the Worker
        working-directory: apps/cas
        run: pnpm exec cf build

      - name: Wait for the cas-migrate build
        wait: migrate-build

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.CAS_DATABASE_URL }}
        run: target/migrate/debug/cas-migrate

      - name: Deploy
        working-directory: apps/cas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="${COMMIT_MESSAGE%%$'\n'*}"
          pnpm exec cf deploy --prebuilt --tag "${GITHUB_SHA::12}" --message "${message:-manual release}"
