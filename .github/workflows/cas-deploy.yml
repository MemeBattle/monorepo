name: 'CAS release'

# CAS and its frontend are one Cloudflare Worker on cas.mems.fun: the Rust
# entrypoint (ADR 0022) for CAS's own paths, the SPA as its static assets
# (apps/cas/cloudflare.config.ts). Migrations run first, outside the Worker,
# over a direct connection to the origin database.

on:
  workflow_dispatch:
  push:
    # TEMPORARY: the test release from the PR branch. Revert before merging.
    branches: [master, feat/cas-frontend-and-cd]
    paths:
      - 'apps/cas/**'
      - 'apps/cas-frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'vendor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cas-deploy.yml'

# Never two releases at once, and never cancel one halfway through its
# migrations.
concurrency:
  group: cas-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 2155fed9f68a1bc94fab7d9e5bb6eaac

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: CAS-production
      url: https://cas.mems.fun

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: '1.21.1'

      # Node, the worker-build install and the migrations do not depend on
      # each other, so all three run in the background, and each later step
      # waits only for what it uses. `cargo install` builds in a target
      # directory of its own, so it does not wait on the lock of the
      # migrations' build.
      - name: Prepare Node.js
        id: node
        uses: ./.github/actions/prepare-nodejs
        background: true

      # The same version as the `worker` crate in apps/cas/Cargo.toml.
      - name: Install worker-build
        id: worker-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall worker-build@0.8.7 --no-confirm --disable-telemetry
        background: true

      - name: Apply migrations
        id: migrations
        working-directory: apps/cas
        env:
          SQLX_OFFLINE: 'true'
          DATABASE_URL: ${{ secrets.CAS_DATABASE_URL }}
        run: cargo run --locked --bin cas-migrate
        background: true

      # Node's PATH reaches the steps below only after this.
      - name: Wait for Node
        wait: node

      # Before the deploy, not inside its build command: Wrangler checks that
      # the assets directory exists before it runs that command.
      - name: Build the frontend
        run: pnpm cas:front:build

      # A failed migration fails the job here, before anything is deployed.
      - name: Wait for the migrations and worker-build
        wait: [migrations, worker-build]

      # Builds the Worker (apps/cas/wrangler.config.ts) and uploads it with the
      # SPA as its assets.
      - name: Deploy
        working-directory: apps/cas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="${COMMIT_MESSAGE%%$'\n'*}"
          pnpm exec cf deploy --tag "${GITHUB_SHA::12}" --message "${message:-manual release}"
