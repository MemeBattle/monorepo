name: 'Prepare nodejs'
description: 'Install nodejs. Install dependencies'

inputs:
  working-directory:
    description: 'The workspace root to install, relative to the repository checkout'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'

    - name: Install dependencies
      shell: 'bash'
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install
