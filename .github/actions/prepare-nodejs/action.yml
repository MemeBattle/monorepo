name: 'Prepare nodejs'
description: 'Install nodejs. Install dependencies'

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'

    - name: Install dependencies
      shell: 'bash'
      run: pnpm install
