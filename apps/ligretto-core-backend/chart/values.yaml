# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/memebattle/ligretto-core-backend
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: github-registry-secret

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: core.ligretto.app
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: ligretto-app-tls
      hosts:
        - core.ligretto.app

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi



# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Removal of expired authorization requests and of sessions past the cookie grace window. Hourly is ample:
# sessions are kept a week past their grant by design, so a run never has much to do.
sweep:
  schedule: "17 * * * *"

# App Key configuration
# If not provided, a random 32-character string will be generated
appKey: ""

# Environment variables configuration
env:
  # Server configuration
  PORT: "3333"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  # CAS configuration, as @memebattle/ligretto-auth asks for it. The `ligretto` client is not registered in the
  # production CAS until #812, and the cutover is #818, so the secret below is a placeholder. Until #812 every
  # call that authenticates this client against CAS fails: no sign-in can complete and no guest can be minted,
  # both answering 503 with the stable code `cas_rejected`. The other paths behave normally — /auth/sign-in still
  # redirects to CAS with its state cookie, a callback that matches no state is a 400, and a sessionless
  # /auth/logout redirects back to the app. /games, /health and the hourly sweep are unaffected.
  #
  # The secret #812 generates must never take the placeholder's place here. Everything under `env` is rendered as
  # a literal `value:` on the container — by deployment.yaml, migration-job.yaml and sweep-cronjob.yaml alike —
  # and ligretto-deploy.yml hands this file to helm straight from the checkout, so a real secret written here is
  # committed to git and readable in the rendered Deployment. #812 delivers it the way the database credentials
  # already arrive: an ExternalSecret in templates/secrets.yaml feeding a `secretKeyRef` in the three pod
  # templates, with LIGRETTO_CAS_CLIENT_SECRET leaving `env` at that point.
  #
  # The frontend is the other half of this contract, and it moves in #817. ligretto-frontend bootstraps with
  # `POST /api/auth/me`, which this release answers with a 404 — only GET is mounted — and it renders no route
  # until that call succeeds, so between this deploy and #817 every visitor to ligretto.app sits on the loader
  # screen, guests included. ligretto-deploy.yml rebuilds and redeploys both apps from every push to master, so
  # this backend must not reach production separated from the new frontend.
  CAS_ISSUER: "https://cas.mems.fun"
  LIGRETTO_CAS_CLIENT_ID: "ligretto"
  # A placeholder, not a secret: see the ExternalSecret note above before putting a real value here.
  LIGRETTO_CAS_CLIENT_SECRET: "not-registered-until-812"
  LIGRETTO_CORE_AUTH_REDIRECT_URI: "https://core.ligretto.app/api/auth/callback"
  LIGRETTO_CORE_AUTH_POST_LOGOUT_REDIRECT_URI: "https://ligretto.app/"
  LIGRETTO_CORE_AUTH_APP_URL: "https://ligretto.app/"
  LIGRETTO_CORE_AUTH_SESSION_TRANSPORT: "cookie"
  # Application configuration
  LIGRETTO_CORE_APP_NAME: "ligretto-core-backend"

# External Secrets configuration
externalSecrets:
  # Production environment secret configuration
  productionEnv:
    key: "ligretto-production-env"
    property: "env"

# Deployer configuration
deployer:
  enabled: false


