# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/memebattle/ligretto-core-backend
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: github-registry-secret

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: core.ligretto.app
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: ligretto-app-tls
      hosts:
        - core.ligretto.app

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi



# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Removal of expired authorization requests and of sessions past the cookie grace window. Hourly is ample:
# sessions are kept a week past their grant by design, so a run never has much to do.
sweep:
  schedule: "17 * * * *"

# App Key configuration
# If not provided, a random 32-character string will be generated
appKey: ""

# Environment variables configuration
env:
  # Server configuration
  PORT: "3333"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  # CAS configuration, as @memebattle/ligretto-auth asks for it. The `ligretto` client is not registered in the
  # production CAS until #812 and the cutover is #818, so the secret is a placeholder: until then the auth routes
  # answer 503 with a stable code (`cas_rejected`), while /games, /health and the hourly sweep are unaffected.
  # Production sign-in is already gone with the legacy CAS, so nothing working today is lost.
  CAS_ISSUER: "https://cas.mems.fun"
  LIGRETTO_CLIENT_ID: "ligretto"
  LIGRETTO_CLIENT_SECRET: "not-registered-until-812"
  LIGRETTO_CORE_AUTH_REDIRECT_URI: "https://core.ligretto.app/api/auth/callback"
  LIGRETTO_CORE_AUTH_POST_LOGOUT_REDIRECT_URI: "https://ligretto.app/"
  LIGRETTO_CORE_AUTH_APP_URL: "https://ligretto.app/"
  LIGRETTO_CORE_AUTH_SESSION_TRANSPORT: "cookie"
  # Application configuration
  LIGRETTO_CORE_APP_NAME: "ligretto-core-backend"

# External Secrets configuration
externalSecrets:
  # Production environment secret configuration
  productionEnv:
    key: "ligretto-production-env"
    property: "env"

# Deployer configuration
deployer:
  enabled: false


