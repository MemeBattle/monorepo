apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "common.fullname" . }}-auth-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.sweep.schedule | quote }}
  # One sweep at a time: a run that overlaps itself only queues behind its own per-session locks.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "common.selectorLabels" . | nindent 12 }}
        spec:
          imagePullSecrets:
            - name: github-registry-secret
          containers:
            - name: {{ .Chart.Name }}-auth-sweep
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              workingDir: /ligretto-core-backend
              # The built app, so the retention window is the one the deployed ligretto-auth defines.
              command: ["node", "build/ace.js", "auth:sweep"]
              env:
                - name: LIGRETTO_CORE_APP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-app-key-secret
                      key: LIGRETTO_CORE_APP_KEY
                - name: LIGRETTO_CORE_DB_CONNECTION
                  value: pg
                - name: LIGRETTO_CORE_PG_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-ligretto-db-secret
                      key: host
                - name: LIGRETTO_CORE_PG_PORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-ligretto-db-secret
                      key: port
                - name: LIGRETTO_CORE_PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-ligretto-db-secret
                      key: username
                - name: LIGRETTO_CORE_PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-ligretto-db-secret
                      key: password
                - name: LIGRETTO_CORE_PG_DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.fullname" . }}-ligretto-db-secret
                      key: database
                - name: NODE_TLS_REJECT_UNAUTHORIZED
                  value: "0"
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              volumeMounts:
                - name: cas-key-volume
                  mountPath: {{ .Values.env.LIGRETTO_CORE_CAS_PUBLIC_KEY_PATH }}
                  subPath: key.pem
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: cas-key-volume
              secret:
                secretName: {{ include "common.fullname" . }}-cas-key-secret
          restartPolicy: OnFailure
