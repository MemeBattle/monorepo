services:
  cas-pg:
    image: postgres:18
    ports:
      # 5434 avoids clashes with a local Postgres (5432) and ligretto-core-pg (5433).
      - 5434:5432
    environment:
      POSTGRES_USER: cas
      POSTGRES_PASSWORD: cas
      POSTGRES_DB: cas
    volumes:
      - pg-cas:/var/lib/postgresql

volumes:
  pg-cas: {}
