[package]
name = "cas"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cas"

[[bin]]
name = "cas-migrate"
path = "src/bin/migrate.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
getrandom = "0.4.3"
icu_properties = "2.3"
miette = "7.6.0"
nutype = { version = "0.7.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "catch-panic", "full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.0", features = ["fast-rng", "serde"] }
# `danger-allow-state-serialisation` lets ceremony state be stored in Postgres
# so any replica can finish a ceremony (src/webauthn/ceremonies.rs). The danger
# the feature guards against is client-side storage, which CAS never does.
# `conditional-ui` exposes the discoverable authentication API that login uses
# (src/webauthn/login.rs): a challenge without `allowCredentials`, answered by
# whichever credential the authenticator discovers for the relying party.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# Public WebAuthn option types used to require discoverable credentials.
webauthn-rs-proto = "=0.5.5"

[dev-dependencies]
# Software authenticator driving the WebAuthn ceremonies in tests, exposed
# through `cas::testing` in test builds. Its version must move in lockstep with
# webauthn-rs: it pins the same webauthn-rs-core and webauthn-rs-proto, which is
# what makes the types interchangeable.
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
